spring.application.name=ncp-com-web

# Server Config
server.port=${PORT:8080}

# MySQL Database Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ncp_com_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret (Base64 encoded string - 256 bit min)
app.jwt.secret=${APP_JWT_SECRET:4f7a93c8d1b2e5a6f84920c1d4e7f9a8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6}
app.jwt.expirationMs=${APP_JWT_EXPIRATION_MS:86400000}

# Root Provincial Director Credentials (Overridable via Environment for Cloud Deployments)
app.director.username=${APP_DIRECTOR_USERNAME:provincial_director}
app.director.password=${APP_DIRECTOR_PASSWORD:NcpDirector@2026#Secure}

# File Upload Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}
logging.level.org.springframework.security=WARN
spring.devtools.restart.enabled=false
