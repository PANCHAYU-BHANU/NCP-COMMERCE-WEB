spring.application.name=ncp-com-web

# Server Config
server.port=8080

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/ncp_com_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (Base64 encoded string - 256 bit min)
app.jwt.secret=4f7a93c8d1b2e5a6f84920c1d4e7f9a8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6
app.jwt.expirationMs=86400000

# File Upload Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads
logging.level.org.springframework.security=DEBUG
spring.devtools.restart.enabled=false
